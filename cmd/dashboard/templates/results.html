{{define "results"}}
{{if .Err}}
  <div class="border border-red-300 bg-red-50 text-red-800 rounded-md p-4 whitespace-pre-wrap">{{.Err}}</div>
{{else if not .Results}}
  <p class="text-slate-500">no results</p>
{{else}}
  <script type="application/json" id="treemap-data">{{.TreemapJSON}}</script>

  <div class="border border-slate-200 rounded-lg p-3 shadow-sm mb-6">
    <div class="flex items-center gap-2 text-sm mb-2" id="tm-crumbs"></div>
    <div class="flex justify-between font-mono text-xs text-slate-400 px-1 mb-2">
      <span id="tm-meta-count"></span>
      <span id="tm-meta-total"></span>
    </div>
    <svg id="treemap" viewBox="0 0 1400 320" class="w-full h-auto rounded"></svg>
    <p class="text-xs text-slate-500 mt-2" id="tm-subtitle"></p>
    <div class="flex gap-4 text-xs text-slate-500 mt-2" id="tm-legend"></div>
  </div>

  <div class="border border-slate-200 rounded-lg overflow-hidden"
       title="Allocation sites gosys analyzed, ranked by flat bytes. Select a site on the left to see its matched rule(s), guidance, and source on the right.">
    <div class="px-4 py-2 border-b border-slate-200 bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wide">Findings</div>
    <div class="grid grid-cols-1 md:grid-cols-[300px_1fr]">
      <div id="findings-rows" class="divide-y divide-slate-200 md:border-r md:border-slate-200 md:max-h-[calc(100vh-20rem)] md:overflow-y-auto"></div>
      <div id="findings-detail" class="p-6"></div>
    </div>
  </div>

  <script>
  (function () {
    var sites = JSON.parse(document.getElementById("treemap-data").textContent);
    if (!sites.length) return;

    function fmtBytes(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(1) + " MB";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + " KB";
      return n + " B";
    }

    function packageOf(file) {
      var parts = file.split("/");
      return parts.length > 1 ? parts.slice(0, -1).join("/") : "(root)";
    }

    function computePackages() {
      var groups = new Map();
      sites.forEach(function (s) {
        var key = packageOf(s.file);
        if (!groups.has(key)) groups.set(key, { key: key, isPackage: true, bytes: 0, count: 0, flagged: 0, items: [] });
        var g = groups.get(key);
        g.bytes += s.bytes;
        g.count += 1;
        if (s.pattern) g.flagged += 1;
        g.items.push(s);
      });
      return Array.from(groups.values());
    }

    // Squarified treemap layout (Bruls et al.).
    function squarify(items, x, y, w, h) {
      var nodes = [];
      var data = items.slice().sort(function (a, b) { return b.bytes - a.bytes; });
      var total = data.reduce(function (s, d) { return s + d.bytes; }, 0) || 1;
      var area = w * h;
      var scaled = data.map(function (d) {
        var copy = Object.assign({}, d);
        copy.a = (d.bytes / total) * area;
        return copy;
      });

      var rectX = x, rectY = y, rectW = w, rectH = h, i = 0;
      while (i < scaled.length) {
        var shortSide = Math.min(rectW, rectH);
        var row = [scaled[i]];
        var rowArea = scaled[i].a;
        var bestRatio = worstRatio(row, shortSide);
        var j = i + 1;
        while (j < scaled.length) {
          var testRow = row.concat([scaled[j]]);
          var testArea = rowArea + scaled[j].a;
          var ratio = worstRatio(testRow, shortSide, testArea);
          if (ratio <= bestRatio) { row = testRow; rowArea = testArea; bestRatio = ratio; j++; } else break;
        }

        var rowLenFrac = rowArea / (rectW * rectH);
        if (rectW >= rectH) {
          var rowW = rectW * rowLenFrac, cy = rectY;
          row.forEach(function (d) {
            var itemH = (d.a / rowArea) * rectH;
            nodes.push(Object.assign({}, d, { x: rectX, y: cy, w: rowW, h: itemH }));
            cy += itemH;
          });
          rectX += rowW; rectW -= rowW;
        } else {
          var rowH = rectH * rowLenFrac, cx = rectX;
          row.forEach(function (d) {
            var itemW = (d.a / rowArea) * rectW;
            nodes.push(Object.assign({}, d, { x: cx, y: rectY, w: itemW, h: rowH }));
            cx += itemW;
          });
          rectY += rowH; rectH -= rowH;
        }
        i = j;
      }
      return nodes;

      function worstRatio(row, side, areaOverride) {
        var sum = areaOverride || row.reduce(function (s, d) { return s + d.a; }, 0);
        var maxA = Math.max.apply(null, row.map(function (d) { return d.a; }));
        var minA = Math.min.apply(null, row.map(function (d) { return d.a; }));
        var sideSq = side * side;
        return Math.max((sideSq * maxA) / (sum * sum), (sum * sum) / (sideSq * minA));
      }
    }

    var packages = computePackages();
    var totalBytes = sites.reduce(function (s, d) { return s + d.bytes; }, 0) || 1;
    var maxSiteBytes = Math.max.apply(null, sites.map(function (s) { return s.bytes; }));

    function severityTier(s) {
      if (!s.pattern) return "none";
      var t = s.bytes / maxSiteBytes;
      if (t > 0.55) return "high";
      if (t > 0.22) return "mid";
      return "low";
    }
    var tierColor = { high: "#b45309", mid: "#f59e0b", low: "#fde68a", none: "#e2e8f0" };
    // tierTitle backs the tooltip on each severity bar. This is a per-site
    // metric (flagged status + share of the hottest site's bytes), distinct
    // from the treemap's "All packages" legend, which aggregates by package
    // (% of sites flagged) -- same amber palette, different question answered.
    var tierTitle = {
      high: "Flagged — high severity: a large share of the hottest site's bytes",
      mid: "Flagged — medium severity",
      low: "Flagged — low severity: a small share of the hottest site's bytes",
      none: "No pattern matched"
    };
    function colorForSite(d) { return tierColor[severityTier(d)]; }
    function colorForPackage(g) {
      var frac = g.flagged / g.count;
      if (frac === 0) return "#e2e8f0";
      if (frac > 0.6) return "#b45309";
      if (frac > 0.25) return "#f59e0b";
      return "#fde68a";
    }
    function textColorFor(hasSignal) { return hasSignal ? "#451a03" : "#334155"; }

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.getElementById("treemap");
    var W = 1400, H = 320;
    var currentPackage = null;
    var selectedEl = null;

    function render() {
      svg.innerHTML = "";
      selectedEl = null;

      var items = currentPackage ? currentPackage.items : packages;
      var nodes = squarify(items, 0, 0, W, H);
      var isRoot = !currentPackage;

      nodes.forEach(function (n) {
        var g = document.createElementNS(svgNS, "g");
        var rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("x", n.x);
        rect.setAttribute("y", n.y);
        rect.setAttribute("width", Math.max(0, n.w));
        rect.setAttribute("height", Math.max(0, n.h));
        rect.setAttribute("fill", isRoot ? colorForPackage(n) : colorForSite(n));
        rect.setAttribute("stroke", "#fff");
        rect.setAttribute("stroke-width", "1.5");
        rect.style.cursor = "pointer";
        rect.setAttribute("tabindex", "0");
        g.appendChild(rect);

        var hasSignal = isRoot ? n.flagged > 0 : !!n.pattern;
        if (n.w > 70 && n.h > 30) {
          var label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", n.x + 8);
          label.setAttribute("y", n.y + 18);
          label.setAttribute("fill", textColorFor(hasSignal));
          label.setAttribute("font-family", "ui-monospace, SFMono-Regular, Consolas, monospace");
          label.style.pointerEvents = "none";
          var rawName = isRoot ? n.key : n.fn;
          var maxChars = Math.floor(n.w / 7);
          var name = rawName.length > maxChars ? rawName.slice(0, maxChars - 1) + "…" : rawName;
          var tspan1 = document.createElementNS(svgNS, "tspan");
          tspan1.setAttribute("font-size", "12");
          tspan1.setAttribute("font-weight", "600");
          tspan1.textContent = name;
          label.appendChild(tspan1);
          if (n.h > 46) {
            var tspan2 = document.createElementNS(svgNS, "tspan");
            tspan2.setAttribute("x", n.x + 8);
            tspan2.setAttribute("y", n.y + 34);
            tspan2.setAttribute("font-size", "10.5");
            tspan2.textContent = isRoot
              ? fmtBytes(n.bytes) + " · " + n.count + " sites · " + n.flagged + " flagged"
              : fmtBytes(n.bytes);
            label.appendChild(tspan2);
          }
          g.appendChild(label);
        }

        var activate = function () { isRoot ? drillInto(n) : selectTile(n, rect); };
        rect.addEventListener("click", activate);
        rect.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
        });

        svg.appendChild(g);
      });

      svg.setAttribute("viewBox", "0 0 " + W + " " + H);

      var shownBytes = items.reduce(function (s, d) { return s + d.bytes; }, 0);
      document.getElementById("tm-meta-count").textContent = isRoot ? packages.length + " packages" : items.length + " sites";
      document.getElementById("tm-meta-total").textContent = fmtBytes(shownBytes) + (isRoot ? " total flat" : " in this package");
      document.getElementById("tm-subtitle").textContent = isRoot
        ? "Packages, sized by total flat bytes. Click one to drill into its allocation sites."
        : "Sites within " + currentPackage.key + ", sized by flat bytes. Color marks whether a gosys rule matched.";
      document.getElementById("tm-legend").innerHTML = isRoot
        ? '<span class="text-slate-400">Color = share of sites in the package matched by a rule:</span>'
        + '<span class="inline-block w-2.5 h-2.5 rounded-sm" style="background:#e2e8f0" title="0% of sites in this package matched a gosys rule"></span>'
        + '<span class="inline-block w-2.5 h-2.5 rounded-sm" style="background:#fde68a" title="1&ndash;60% of sites in this package matched a gosys rule"></span>'
        + '<span class="inline-block w-2.5 h-2.5 rounded-sm" style="background:#b45309" title="Over 60% of sites in this package matched a gosys rule"></span>'
        : '<span class="text-slate-400">Color = whether &amp; how much this site was flagged, relative to the hottest site shown:</span>'
        + '<span class="inline-block w-2.5 h-2.5 rounded-sm" style="background:#e2e8f0" title="This allocation site did not match any gosys rule"></span>'
        + '<span class="inline-block w-2.5 h-2.5 rounded-sm" style="background:#fde68a" title="Matched a rule; flat bytes are a small share of the hottest site in this package"></span>'
        + '<span class="inline-block w-2.5 h-2.5 rounded-sm" style="background:#b45309" title="Matched a rule; flat bytes are a large share of the hottest site in this package"></span>';

      renderCrumbs();
    }

    function drillInto(pkg) { currentPackage = pkg; render(); }

    function renderCrumbs() {
      var el = document.getElementById("tm-crumbs");
      el.innerHTML = "";
      var root = document.createElement("button");
      root.type = "button";
      root.textContent = "All packages";
      root.className = "font-mono " + (currentPackage ? "text-blue-600 hover:underline" : "text-slate-900");
      if (currentPackage) root.addEventListener("click", function () { currentPackage = null; render(); });
      el.appendChild(root);
      if (currentPackage) {
        var sep = document.createElement("span");
        sep.className = "text-slate-400";
        sep.textContent = "/";
        var cur = document.createElement("span");
        cur.className = "font-mono text-slate-900";
        cur.textContent = currentPackage.key;
        el.appendChild(sep);
        el.appendChild(cur);
      }
    }

    // ---------------- findings list + detail (two-pane, borderless) ----------------

    var rowsEl = document.getElementById("findings-rows");
    var detailEl = document.getElementById("findings-detail");
    var rowEls = []; // parallel to sites, for selection styling

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function renderRows() {
      rowsEl.innerHTML = "";
      rowEls = [];
      sites.forEach(function (s, i) {
        var tier = severityTier(s);
        var row = document.createElement("div");
        row.className = "flex gap-3 pl-3 pr-4 py-3 cursor-pointer hover:bg-slate-50 relative";
        row.style.borderLeft = tier === "none" ? "4px solid transparent" : "4px solid " + tierColor[tier];
        row.title = tierTitle[tier];
        row.innerHTML =
          '<div class="min-w-0 flex-1">' +
            '<div class="font-mono text-xs font-semibold text-slate-700 truncate mb-0.5">' + (escapeHtml(s.pattern) || "no pattern matched") + "</div>" +
            '<div class="font-mono text-[11px] text-slate-400 truncate">' + escapeHtml(s.fn) + ":" + s.line + "</div>" +
            '<div class="font-mono text-[11px] text-slate-500 mt-0.5">' + fmtBytes(s.bytes) + "</div>" +
          "</div>";
        row.addEventListener("click", function () { selectSite(i); });
        rowsEl.appendChild(row);
        rowEls.push(row);
      });
    }

    function highlightRow(i) {
      rowEls.forEach(function (el, idx) {
        el.classList.toggle("bg-blue-50", idx === i);
      });
    }

    // codeViewer renders a bordered, line-numbered code block for one
    // finding's Source, starting the gutter at SourceLine so numbers match
    // the real file -- this is what replaced the old fixed-height
    // overflow-x:auto <pre> that forced horizontal scrolling to read.
    function codeViewer(finding, site) {
      var lines = finding.source ? finding.source.replace(/\s+$/, "").split("\n") : [];
      var startLine = finding.sourceLine || site.line;
      var rowsHtml = lines.map(function (line, i) {
        return '<div class="flex">' +
          '<span class="flex-none w-10 text-right pr-3 text-slate-400 text-xs font-mono leading-6 select-none">' + (startLine + i) + "</span>" +
          '<span class="flex-1 min-w-0 text-xs font-mono leading-6 text-slate-800 whitespace-pre-wrap break-words">' + (escapeHtml(line) || "&nbsp;") + "</span>" +
        "</div>";
      }).join("");

      var wrap = document.createElement("div");
      wrap.className = "border border-slate-200 rounded-md overflow-hidden mt-3";
      wrap.innerHTML =
        '<div class="flex items-center gap-2 px-3 py-1.5 bg-slate-50 border-b border-slate-200">' +
          '<span class="font-mono text-xs text-slate-500"><b class="text-slate-700 font-semibold">' + escapeHtml(site.file.split("/").pop()) + "</b> &middot; " + escapeHtml(site.fn) + "</span>" +
          '<span class="text-[10px] font-semibold uppercase tracking-wide text-slate-400 border border-slate-200 rounded px-1.5 py-0.5">go</span>' +
          '<button type="button" class="ml-auto text-xs font-semibold text-slate-500 border border-slate-200 rounded px-2 py-0.5 hover:bg-white">⧉ Copy</button>' +
        "</div>" +
        '<div class="py-2 overflow-x-auto">' + rowsHtml + "</div>";

      wrap.querySelector("button").addEventListener("click", function (e) {
        var btn = e.currentTarget;
        try { navigator.clipboard && navigator.clipboard.writeText(lines.join("\n")); } catch (err) {}
        var original = btn.textContent;
        btn.textContent = "✓ Copied";
        setTimeout(function () { btn.textContent = original; }, 1200);
      });

      return wrap;
    }

    function renderDetail(i) {
      var s = sites[i];
      detailEl.innerHTML = "";
      detailEl.className = "p-6";
      var body = document.createElement("div");
      detailEl.appendChild(body);

      var head = document.createElement("div");
      head.className = "flex items-baseline gap-2 flex-wrap mb-1";
      head.innerHTML =
        '<span class="font-mono text-sm font-semibold text-slate-800">' + (escapeHtml(s.pattern) || "no pattern matched") + "</span>" +
        '<span class="font-mono text-xs text-slate-400 ml-1">' + escapeHtml(s.file) + ":" + s.line + " &middot; " + escapeHtml(s.fn) + "</span>" +
        '<span class="font-mono text-xs text-slate-500 ml-auto">' + fmtBytes(s.bytes) + "</span>";
      body.appendChild(head);

      if (!s.findings || !s.findings.length) {
        var p = document.createElement("p");
        p.className = "text-sm text-slate-400 mt-3";
        p.textContent = "This site was hot, but no known anti-pattern matched.";
        body.appendChild(p);
        return;
      }

      s.findings.forEach(function (f) {
        var block = document.createElement("div");
        block.className = "mt-4 first:mt-3";
        var msg = document.createElement("p");
        msg.className = "text-sm text-slate-700 leading-relaxed max-w-[80ch]";
        msg.textContent = f.message;
        block.appendChild(msg);
        if (f.source) block.appendChild(codeViewer(f, s));
        body.appendChild(block);
      });
    }

    function selectSite(i) {
      highlightRow(i);
      renderDetail(i);
    }

    function findSiteIndex(file, line) {
      for (var i = 0; i < sites.length; i++) {
        if (sites[i].file === file && sites[i].line === line) return i;
      }
      return -1;
    }

    function selectTile(n, el) {
      if (selectedEl) selectedEl.setAttribute("stroke-width", "1.5");
      el.setAttribute("stroke", "#0f172a");
      el.setAttribute("stroke-width", "2.5");
      selectedEl = el;

      var idx = findSiteIndex(n.file, n.line);
      if (idx !== -1) {
        selectSite(idx);
        rowEls[idx].scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    renderRows();
    if (sites.length) selectSite(0);
    render();
  })();
  </script>
{{end}}
{{end}}
