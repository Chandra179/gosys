<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gosys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-white text-slate-900">
  <header class="border-b border-slate-200">
    <div class="max-w-[1400px] mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-3">
      <h1 class="text-lg font-bold whitespace-nowrap">gosys</h1>
      <form hx-post="/analyze" hx-target="#results" hx-swap="innerHTML"
            class="flex flex-wrap items-end gap-3 flex-1">
        <div class="flex-1 min-w-[220px]">
          <label for="target" class="block text-xs font-semibold text-slate-500 mb-1">Live target (host:port)</label>
          <input type="text" id="target" name="target" placeholder="localhost:6060" required
                 class="block w-full border border-slate-300 rounded px-2 py-1 text-sm">
        </div>
        <div class="w-24">
          <label for="top" class="block text-xs font-semibold text-slate-500 mb-1">Top N</label>
          <input type="number" id="top" name="top" value="{{.Top}}" min="1"
                 class="block w-full border border-slate-300 rounded px-2 py-1 text-sm">
        </div>
        <button type="submit" class="bg-slate-900 text-white px-4 py-1.5 rounded text-sm font-semibold h-[30px]">
          Analyze
        </button>
      </form>
    </div>
    <p class="max-w-[1400px] mx-auto px-4 pb-2 text-xs text-slate-500">
      Fetches <code>/debug/pprof/heap</code> directly from the target and runs it against this repo checkout.
    </p>
  </header>

  <main class="max-w-[1400px] mx-auto my-6 px-4">
    <div id="results">
      {{template "results" .}}
    </div>
  </main>
</body>
</html>
